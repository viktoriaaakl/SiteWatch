services:
  monitor:
    build: .
    env_file: .env
    environment:
      UPTIME_DB: /data/uptime.db
    volumes: ["data:/data"]
    restart: unless-stopped
  dashboard:
    build: .
    command: python -m uptime_monitor.dashboard
    environment:
      UPTIME_DB: /data/uptime.db
    volumes: ["data:/data"]
    ports: ["8000:8000"]
    restart: unless-stopped
volumes:
  data:
